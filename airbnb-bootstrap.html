<html>
<head>
  <meta charset="utf-8">

  <title>Bootstrap demo</title>

  <!-- Need to read device screen width (Bootstrap) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Fontawesome CSS only! -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.2/css/all.css">
</head>
<body>
  <!-- navbar -->
  <div class="border-bottom border-2">
    <div class="container d-flex justify-content-between align-items-center py-2">
      <div>
        <img src="images/logo.png" alt="" class="rounded-circle w-50">
      </div>
      <a href="#" class="btn btn-primary">Login</a>
    </div>
  </div>
  <!-- content -->
  <div class="container mb-5">
    <div class="row my-4">
      <div class="col-12 col-lg-8">
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner rounded">
            <div class="carousel-item active">
              <img src="images/flat.jpg" alt="" class="w-100 d-block">
            </div>
            <div class="carousel-item">
              <img src="images/bedroom.jpg" alt="" class="w-100 d-block">
            </div>
            <div class="carousel-item">
              <img src="images/bathroom.jpg" alt="" class="w-100 d-block">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
        <h1>Lovely flat in Meguro, Tokyo</h1>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dolorem, quo iusto sint cupiditate consectetur repudiandae eveniet iste at vero officiis quaerat architecto impedit? Quod molestiae repellat, temporibus dolorem quidem voluptate!</p>
      </div>
      <div class="col-12 col-lg-4">
        <div class="border rounded py-3 px-4">
          <h2>Book this Flat</h2>
          <form>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Start Date</label>
              <input type="date" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">End Date</label>
              <input type="date" class="form-control" id="exampleInputPassword1">
            </div>
            <button type="submit" class="btn btn-primary w-100">Book now</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JavaScript library -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
